<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solution</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --surface-2: #171717;
      --text: #ffffff;
      --muted: #a3a3a3;
      --green: #00C853;
      --yellow: #FFD600;
      --border: #262626;
      --textarea-bg: #121212;
      --textarea-text: #ffffff;
    }

    body.light-mode {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --surface-2: #e4e4e7;
      --text: #09090b;
      --muted: #52525b;
      --border: #d4d4d8;
      --textarea-bg: #ffffff;
      --textarea-text: #09090b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }

    .navbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-photo-nav {
      background: var(--green);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--green); }

    .brand-logo {
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .brand-logo span { color: var(--green); }

    .mode-pill {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .main-wrapper {
      max-width: 820px;
      margin: 24px auto 60px;
      padding: 28px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .sub-caption {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bar-group {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .pill-bar {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 999px;
    }

    .pill-btn {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--green);
      color: #000000;
    }

    .green-subtitle {
      text-align: center;
      color: var(--green);
      font-weight: 700;
      font-size: 0.95rem;
      margin: 12px 0 6px;
    }

    .hero-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .badge-free {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .badge-free span {
      background: rgba(0, 200, 83, 0.12);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .wa-gate-box {
      background: var(--bg);
      border: 1px solid var(--green);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .wa-gate-title {
      font-weight: 800;
      color: var(--green);
      margin-bottom: 8px;
      font-size: 0.98rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0;
    }

    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: 1fr; }
    }

    .btn-cam-big {
      background: var(--green);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-cam-big small, .btn-gal-big small {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .btn-gal-big {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
    }

    .input-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .input-card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .dark-textarea {
      width: 100%;
      min-height: 130px;
      background: var(--textarea-bg);
      color: var(--textarea-text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    .dark-textarea:focus { border-color: var(--green); }

    .action-bottom-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-solve-full {
      flex: 1;
      background: var(--green);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .btn-example-yellow {
      background: var(--yellow);
      color: #000;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .status-line {
      text-align: center;
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 700;
      margin: 16px 0;
    }

    .solution-card {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--green);
      border-radius: 16px;
      padding: 20px;
      display: none;
    }

    .solution-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
